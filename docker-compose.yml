services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: leetcode-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode
      POSTGRES_DB: leetcode
    volumes:
      - leetcode-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis queue
  redis:
    image: redis:7-alpine
    container_name: leetcode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - leetcode-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  leetcode-postgres-data:
    name: leetcode-postgres-data
  leetcode-redis-data:
    name: leetcode-redis-data
